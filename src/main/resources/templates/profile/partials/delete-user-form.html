<section class="space-y-5">
    <header>
        <h3 class="text-base font-semibold text-rose-800">Zona sensible</h3>
        <p class="mt-1 text-sm text-rose-700">Eliminar la cuenta borra el acceso de forma permanente.</p>
    </header>

    <button
        x-data=""
        x-on:click.prevent="$dispatch('open-modal', 'confirm-user-deletion')"
        class="rounded-xl border border-rose-300 bg-rose-600 px-4 py-2.5 text-sm font-medium normal-case tracking-normal text-white hover:bg-rose-500"
    >Eliminar cuenta</button>

    <div
        x-data="{ open: false }"
        x-on:open-modal.window="if ($event.detail === 'confirm-user-deletion') open = true"
        x-on:close.window="open = false"
        x-show="open"
        x-transition
        style="display: none;"
        class="fixed inset-0 z-50 flex items-center justify-center p-3"
    >
        <div class="fixed inset-0 bg-black/50" x-on:click="open = false"></div>
        <div class="relative z-10 w-full max-w-lg rounded-2xl border border-[#e5dec8] bg-white p-6 shadow-xl" @click.stop>
            <form method="post" th:action="@{/profile/destroy}">
                <input type="hidden" name="_method" value="DELETE" />
                <input type="hidden" name="_token" th:value="${_csrf.token}" />

                <h2 class="text-lg font-semibold text-[#2a2419]">Confirmar eliminacion de cuenta</h2>

                <p class="mt-1 text-sm text-[#6e6758]">
                    Esta accion es irreversible. Ingresa tu contrasena para confirmar.
                </p>

                <div class="mt-5">
                    <label for="password" class="mb-2 block text-sm font-medium text-[#4d4026]">Contrasena</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        class="block w-full rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-3 text-[#251e12] focus:border-[#b9943d] focus:ring-[#b9943d]"
                        placeholder="Contrasena"
                    />

                    <p th:if="${error}" class="mt-1 text-sm text-rose-600" th:text="${error}"></p>
                </div>

                <div class="mt-6 flex justify-end gap-2">
                    <button
                        type="button"
                        x-on:click="open = false"
                        class="rounded-xl border border-[#d3c49f] px-4 py-2.5 text-sm font-medium normal-case tracking-normal text-[#5a4314] hover:bg-[#fff5dd]"
                    >
                        Cancelar
                    </button>

                    <button type="submit" class="rounded-xl border border-rose-300 bg-rose-600 px-4 py-2.5 text-sm font-medium normal-case tracking-normal text-white hover:bg-rose-500">
                        Eliminar cuenta
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
