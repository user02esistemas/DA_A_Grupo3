<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>
<div layout:fragment="content">
    <div class="rounded-2xl border border-[#e5dec8] bg-white p-6 shadow-sm">
        <form th:action="@{/productos/{id}(id=${producto.id})}" th:method="post" enctype="multipart/form-data">
            <input type="hidden" name="_method" value="PUT" />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div th:replace="~{productos/_form :: form}"></div>

            <div class="mt-6 flex gap-2">
                <button type="submit" class="rounded-xl bg-[#111] px-4 py-2.5 text-sm font-medium text-white hover:bg-[#262626]">Actualizar producto</button>
                <a th:href="@{/productos}" class="rounded-xl border border-[#d1be8a] px-4 py-2.5 text-sm font-medium text-[#5a4314] hover:bg-[#fff5dd]">Volver</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
