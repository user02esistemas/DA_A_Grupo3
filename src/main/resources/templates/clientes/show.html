<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>
<div layout:fragment="content">
    <div class="rounded-2xl border border-[#e5dec8] bg-white p-6 shadow-sm">
        <div class="grid gap-4 md:grid-cols-2">
            <div>
                <p class="text-xs uppercase tracking-[0.2em] text-[#8a6a2e]">Nombre completo</p>
                <p class="mt-1 text-[#1f1f1f]" th:text="${cliente.nombreCompleto}"></p>
            </div>
            <div>
                <p class="text-xs uppercase tracking-[0.2em] text-[#8a6a2e]">Documento</p>
                <p class="mt-1 text-[#1f1f1f]" th:text="${cliente.documento != null ? cliente.documento : '-'}"></p>
            </div>
            <div>
                <p class="text-xs uppercase tracking-[0.2em] text-[#8a6a2e]">Telefono</p>
                <p class="mt-1 text-[#1f1f1f]" th:text="${cliente.telefono != null ? cliente.telefono : '-'}"></p>
            </div>
            <div>
                <p class="text-xs uppercase tracking-[0.2em] text-[#8a6a2e]">Correo</p>
                <p class="mt-1 text-[#1f1f1f]" th:text="${cliente.correo != null ? cliente.correo : '-'}"></p>
            </div>
        </div>

        <div class="mt-5">
            <p class="text-xs uppercase tracking-[0.2em] text-[#8a6a2e]">Direccion</p>
            <p class="mt-1 text-[#1f1f1f]" th:text="${cliente.direccion != null ? cliente.direccion : '-'}"></p>
        </div>

        <div class="mt-5">
            <p class="text-xs uppercase tracking-[0.2em] text-[#8a6a2e]">Observaciones</p>
            <p class="mt-1 text-[#1f1f1f]" th:text="${cliente.observaciones != null ? cliente.observaciones : '-'}"></p>
        </div>

        <div class="mt-6 flex gap-2">
            <a th:href="@{/clientes/{id}/edit(id=${cliente.id})}" class="rounded-xl bg-[#111] px-4 py-2.5 text-sm font-medium text-white hover:bg-[#262626]">Editar</a>
            <a th:href="@{/clientes}" class="rounded-xl border border-[#d1be8a] px-4 py-2.5 text-sm font-medium text-[#5a4314] hover:bg-[#fff5dd]">Volver</a>
        </div>
    </div>
</div>
</body>
</html>
