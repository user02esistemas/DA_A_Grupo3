<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head><title>Editar usuario - ARTE Y METAL</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-2xl border border-[#e5dec8] bg-white p-6 shadow-sm">
        <form method="POST" th:action="@{/usuarios/{id}/edit(id=${usuario.id})}">
            <input type="hidden" name="_method" value="PUT" />
            <input type="hidden" name="_token" th:value="${_csrf.token}" />
            <div th:replace="~{usuarios/_form}"></div>

            <div class="mt-6 flex gap-2">
                <button type="submit" class="rounded-xl bg-[#111] px-4 py-2.5 text-sm font-medium text-white hover:bg-[#262626]">Actualizar usuario</button>
                <a th:href="@{/usuarios}" class="rounded-xl border border-[#d1be8a] px-4 py-2.5 text-sm font-medium text-[#5a4314] hover:bg-[#fff5dd]">Volver</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
