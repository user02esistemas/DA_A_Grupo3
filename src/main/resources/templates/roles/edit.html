<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head><title>Editar rol - ARTE Y METAL</title></head>
<body>
<div layout:fragment="content">

    <div class="rounded-2xl border border-[#e5dec8] bg-white p-6 shadow-sm">
        <form method="POST" th:action="@{/roles/{id}(id=${rol.id})}">
            <input type="hidden" name="_method" value="PUT" />
            <input type="hidden" name="_token" th:value="${_csrf.token}" />
            <div th:replace="~{roles/_form}"></div>

            <div class="mt-6 flex gap-2">
                <button type="submit" class="rounded-xl bg-[#111] px-4 py-2.5 text-sm font-medium text-white hover:bg-[#262626]">Actualizar rol</button>
                <a th:href="@{/roles}" class="rounded-xl border border-[#d3c49f] px-4 py-2.5 text-sm font-medium text-[#5a4314]">Volver</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
