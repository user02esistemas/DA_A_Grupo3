<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head><title>Roles - ARTE Y METAL</title></head>
<body>
<div layout:fragment="content">

    <div class="space-y-5">
        <div class="rounded-2xl border border-[#e5dec8] bg-white p-4 shadow-sm">
            <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
                <form method="GET" th:action="@{/roles}" class="flex w-full max-w-xl gap-2">
                    <input type="text" name="q" th:value="${busqueda}" class="w-full rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-2.5 text-sm" placeholder="Buscar por nombre o descripcion" />
                    <button type="submit" class="rounded-xl border border-[#b9943d] px-4 py-2.5 text-sm font-medium text-[#5a4314] hover:bg-[#fff5dd]">Buscar</button>
                </form>
                <span sec:authorize="hasAuthority('roles.gestionar')">
                    <a th:href="@{/roles/create}" class="rounded-xl bg-[#111] px-4 py-2.5 text-sm font-medium text-white hover:bg-[#262626]">Nuevo rol</a>
                </span>
            </div>
        </div>

        <div th:if="${session.ok}" class="rounded-xl border border-emerald-300 bg-emerald-50 px-4 py-3 text-sm text-emerald-700" th:text="${session.ok}"></div>

        <div class="overflow-hidden rounded-2xl border border-[#e5dec8] bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-[#faf8f2] text-left text-[#5a4a2a]">
                        <tr>
                            <th class="px-4 py-3 font-semibold">Rol</th>
                            <th class="px-4 py-3 font-semibold">Descripcion</th>
                            <th class="px-4 py-3 font-semibold">Permisos</th>
                            <th class="px-4 py-3 font-semibold">Usuarios</th>
                            <th class="px-4 py-3 font-semibold">Estado</th>
                            <th class="px-4 py-3 font-semibold text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-[#efeee9]">
                        <tr th:each="rol : ${roles}">
                            <td class="px-4 py-3 font-medium text-[#2d2b24]" th:text="${#strings.toUpperCase(rol.nombre)}"></td>
                            <td class="px-4 py-3" th:text="${rol.descripcion != null and rol.descripcion != '' ? rol.descripcion : '-'}"></td>
                            <td class="px-4 py-3" th:text="${rol.permisos != null ? rol.permisos.size() : 0}"></td>
                            <td class="px-4 py-3" th:text="${rol.usuarios != null ? rol.usuarios.size() : 0}"></td>
                            <td class="px-4 py-3">
                                <span th:if="${rol.activo}" class="rounded-lg bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-700">Activo</span>
                                <span th:unless="${rol.activo}" class="rounded-lg bg-rose-50 px-2.5 py-1 text-xs font-medium text-rose-700">Inactivo</span>
                            </td>
                            <td class="px-4 py-3">
                                <div class="flex justify-end gap-2">
                                    <span sec:authorize="hasAuthority('roles.gestionar')">
                                        <a th:href="@{/roles/{id}/edit(id=${rol.id})}" class="rounded-lg border border-[#d3c49f] px-2.5 py-1.5 text-xs font-medium text-[#5a4314]">Editar</a>
                                        <form method="POST" th:action="@{/roles/{id}(id=${rol.id})}" style="display:inline" onsubmit="return confirm('Deseas eliminar este rol?')">
                                            <input type="hidden" name="_method" value="DELETE" />
                                            <input type="hidden" name="_token" th:value="${_csrf.token}" />
                                            <button type="submit" class="rounded-lg border border-rose-300 px-2.5 py-1.5 text-xs font-medium text-rose-700">Eliminar</button>
                                        </form>
                                    </span>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(roles)}">
                            <td colspan="6" class="px-4 py-8 text-center text-[#777]">No hay roles registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="border-t border-[#efeee9] px-4 py-3">
                <!-- Pagination: implementar con la libreria de paginacion elegida -->
            </div>
        </div>
    </div>

</div>
</body>
</html>
