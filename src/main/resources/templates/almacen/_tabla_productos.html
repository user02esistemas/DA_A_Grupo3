<table class="min-w-full text-sm">
    <thead class="bg-[#faf8f2] text-left text-[#5a4a2a]">
        <tr>
            <th class="px-4 py-3">Codigo</th>
            <th class="px-4 py-3">Producto</th>
            <th class="px-4 py-3">Categoria</th>
            <th class="px-4 py-3 text-right">Tienda</th>
            <th class="px-4 py-3 text-right">Almacen</th>
            <th class="px-4 py-3 text-right">Total</th>
            <th class="px-4 py-3 text-right">Precio ref.</th>
            <th class="px-4 py-3 text-center">Estado</th>
        </tr>
    </thead>
    <tbody class="divide-y divide-[#efeee9]">
        <tr th:each="p : ${productos}" class="hover:bg-[#fffbee]">
            <td class="px-4 py-3 font-medium text-[#2d2b24]" th:text="${p.codigo}">COD</td>
            <td class="px-4 py-3 text-[#4a4026]" th:text="${p.nombre}">Producto</td>
            <td class="px-4 py-3 text-[#4a4026]" th:text="${p.categoria}">Cat</td>
            <td class="px-4 py-3 text-right font-medium" th:text="${p.stockTienda}" th:classappend="${p.stockTienda <= 0} ? 'text-red-600' : 'text-[#2d2b24]'">0</td>
            <td class="px-4 py-3 text-right font-medium" th:text="${p.stockAlmacen}" th:classappend="${p.stockAlmacen <= 0} ? 'text-red-600' : 'text-[#2d2b24]'">0</td>
            <td class="px-4 py-3 text-right font-medium"
                th:with="total=${p.stockTienda + p.stockAlmacen}"
                th:text="${total}"
                th:classappend="${total <= 0} ? 'text-red-600' : (${total <= 5} ? 'text-amber-600' : 'text-[#2d2b24]')">0</td>
            <td class="px-4 py-3 text-right text-[#4a4026]">
                <th:block th:if="${p.precioReferencia != null}">
                    <span th:text="'S/ ' + ${#numbers.formatDecimal(p.precioReferencia, 1, 2)}">S/ 0.00</span>
                </th:block>
                <th:block th:unless="${p.precioReferencia != null}">-</th:block>
            </td>
            <td class="px-4 py-3 text-center">
                <span th:if="${p.activo}" class="inline-flex items-center gap-1 rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-800">Activo</span>
                <span th:unless="${p.activo}" class="inline-flex items-center gap-1 rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-600">Inactivo</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(productos)}">
            <td colspan="8" class="px-4 py-6 text-center text-[#777]">No hay productos registrados.</td>
        </tr>
    </tbody>
</table>
