<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>ARTE Y METAL</title>
        <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
        <link rel="preconnect" href="https://fonts.bunny.net">
        <link href="https://fonts.bunny.net/css?family=cinzel:400,600,700|manrope:400,500,600&display=swap" rel="stylesheet" />
        <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    </head>
    <body class="bg-[#050505] text-[#1e1a11] antialiased" style="font-family:'Manrope',sans-serif;">
        <div class="relative min-h-dvh overflow-hidden">
            <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_10%_10%,rgba(212,175,85,0.16),transparent_42%),radial-gradient(circle_at_88%_76%,rgba(158,118,36,0.16),transparent_34%)]"></div>
            <div class="relative mx-auto flex min-h-dvh w-full max-w-7xl items-center justify-center px-4 py-8">
                <main class="w-full max-w-xl rounded-3xl border border-[#d9be75]/80 bg-white p-6 shadow-[0_0_45px_rgba(212,175,85,0.28)] sm:p-8 lg:p-10">
                    <div layout:fragment="content">Contenido</div>
                </main>
            </div>
        </div>
        <!-- Feedback modals -->
        <div x-data="{ showSuccess: [[${exito != null or ok != null or success != null}]], showErrors: [[${error != null}]] }" x-cloak>
            <div x-show="showSuccess" style="display: none;">
                <div x-transition.opacity class="fixed inset-0 z-40 bg-black/50" @click="showSuccess = false"></div>
                <div x-transition class="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="relative w-full max-w-md rounded-2xl border border-gray-200 bg-white px-16 pt-12 pb-12 text-center shadow-xl">
                        <button type="button" @click="showSuccess = false" class="absolute top-3 right-3 inline-flex h-8 w-8 items-center justify-center rounded-lg bg-red-600 text-white hover:bg-red-700" title="Cerrar">
                            <img th:src="@{/icons/cerrar.ico}" alt="Cerrar" class="h-4 w-4 object-contain pointer-events-none">
                        </button>
                        <div class="mx-auto mb-1 flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100">
                            <img th:src="@{/icons/Valido-Verde.png}" alt="Valido" class="h-8 w-8 object-contain pointer-events-none" />
                        </div>
                        <h3 class="text-lg font-semibold text-gray-900" th:text="${exito ?: (ok ?: (success ?: 'Operacion exitosa.'))}"></h3>
                        <button type="button" @click="showSuccess = false" class="mt-6 inline-flex items-center gap-2 rounded-xl bg-[#111] px-12 py-3 text-sm font-semibold text-white hover:bg-[#262626]">Entendido</button>
                    </div>
                </div>
            </div>
            <div x-show="showErrors" style="display: none;">
                <div x-transition.opacity class="fixed inset-0 z-40 bg-black/50" @click="showErrors = false"></div>
                <div x-transition class="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="relative w-full max-w-md rounded-2xl border border-gray-200 bg-white px-8 pt-10 pb-10 text-center shadow-xl">
                        <button type="button" @click="showErrors = false" class="absolute top-3 right-3 inline-flex h-8 w-8 items-center justify-center rounded-lg bg-red-600 text-white hover:bg-red-700" title="Cerrar">
                            <img th:src="@{/icons/cerrar.ico}" alt="Cerrar" class="h-4 w-4 object-contain pointer-events-none">
                        </button>
                        <div class="mx-auto mb-3 flex h-16 w-16 items-center justify-center rounded-full bg-red-100">
                            <img th:src="@{/icons/Alerta-Rojo.png}" alt="Alerta" class="h-8 w-8 object-contain pointer-events-none" />
                        </div>
                        <h3 class="text-lg font-semibold text-gray-900">Ha ocurrido un error</h3>
                        <ul class="mt-3 space-y-1 text-sm text-gray-600">
                            <li th:text="${error}"></li>
                        </ul>
                        <button type="button" @click="showErrors = false" class="mt-6 inline-flex items-center gap-2 rounded-xl bg-[#111] px-12 py-3 text-sm font-semibold text-white hover:bg-[#262626]">Entendido</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
