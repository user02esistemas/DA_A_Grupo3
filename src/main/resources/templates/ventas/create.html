<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<body><div layout:fragment="content">
<style>.btn-icon-sm{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:.5rem;color:white}</style>
<div x-data="ventaForm()" class="space-y-5">
  <div class="flex items-center justify-between"><div><h1 class="text-2xl font-semibold text-gray-900">Nueva venta</h1><p class="mt-1 text-sm text-gray-500">Registra productos de tienda y emite el comprobante.</p></div><a href="/ventas" class="rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-700">Volver</a></div>
  <div th:if="${error}" class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700" th:text="${error}"></div>
  <form th:action="@{/ventas}" method="post" class="space-y-5 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm" @submit="if(!lineas.length){$event.preventDefault();mensaje='Debes agregar al menos un producto'}">
    <div class="rounded-xl border border-gray-200 bg-gray-50 p-4"><div class="mb-3 flex items-center justify-between"><h3 class="text-xs font-semibold uppercase tracking-[.2em] text-gray-500">Productos</h3><span class="text-sm font-semibold">Total: S/ <span x-text="total.toFixed(2)"></span></span></div>
      <p x-show="mensaje" x-text="mensaje" class="mb-3 text-sm text-rose-600"></p>
      <div class="grid gap-3 md:grid-cols-[1fr_auto]"><select x-model="productoElegido" class="rounded-xl border-gray-300 bg-white px-4 py-3"><option value="">Seleccionar producto...</option><option th:each="p:${productos}" th:if="${p.stockTienda>0}" th:value="${p.id}" th:attr="data-nombre=${p.nombre},data-precio=${p.precioReferencia},data-stock=${p.stockTienda}" th:text="${p.codigo+' - '+p.nombre+' | S/ '+#numbers.formatDecimal(p.precioReferencia,1,2)+' | Stock: '+p.stockTienda}"></option></select><button type="button" @click="agregar()" class="rounded-xl bg-[#b9943d] px-5 py-3 text-sm font-semibold text-white">Agregar producto</button></div>
      <div class="mt-4 overflow-hidden rounded-xl border border-gray-200"><table class="min-w-full text-sm"><thead class="bg-white text-left"><tr><th class="px-3 py-2">Producto</th><th class="px-3 py-2">Precio</th><th class="px-3 py-2">Cantidad</th><th class="px-3 py-2">Subtotal</th><th class="px-3 py-2"></th></tr></thead><tbody class="divide-y"><template x-for="(l,i) in lineas" :key="l.id"><tr><td class="px-3 py-2"><input type="hidden" name="producto_id[]" :value="l.id"><span x-text="l.nombre"></span><p class="text-xs text-gray-400" x-text="'Stock: '+l.stock"></p></td><td class="px-3 py-2" x-text="'S/ '+l.precio.toFixed(2)"></td><td class="px-3 py-2"><input name="cantidad[]" type="number" min="1" :max="l.stock" x-model.number="l.cantidad" class="w-24 rounded-lg border-gray-300"></td><td class="px-3 py-2 font-semibold" x-text="'S/ '+(l.precio*l.cantidad).toFixed(2)"></td><td class="px-3 py-2"><button type="button" @click="lineas.splice(i,1)" class="btn-icon-sm bg-red-600"><img src="/icons/eliminar.ico" class="h-4 w-4" alt="Eliminar"></button></td></tr></template><tr x-show="!lineas.length"><td colspan="5" class="px-3 py-6 text-center text-gray-500">Agrega productos a la venta.</td></tr></tbody></table></div>
    </div>
    <div class="grid gap-5 lg:grid-cols-2">
      <div class="rounded-xl border bg-gray-50 p-4"><h3 class="mb-3 text-xs font-semibold uppercase tracking-[.2em] text-gray-500">Cliente</h3><div class="grid gap-3"><div><label class="mb-2 block text-sm font-medium">Documento cliente (DNI/RUC)</label><div class="flex gap-2"><input x-model="documento" class="min-w-0 flex-1 rounded-xl border-gray-300" placeholder="Ejemplo: 76636255"><button type="button" @click="consumidorFinal()" class="rounded-xl bg-[#b9943d] px-4 text-xs font-semibold text-white">Consumidor Final</button></div></div><div><label class="mb-2 block text-sm font-medium">Nombre cliente</label><input name="cliente_nombre" x-model="cliente" class="w-full rounded-xl border-gray-300" placeholder="Nombre del cliente"></div><div><label class="mb-2 block text-sm font-medium">Direccion cliente</label><input name="direccion_cliente" class="w-full rounded-xl border-gray-300" placeholder="Direccion del cliente"></div></div></div>
      <div class="rounded-xl border bg-gray-50 p-4"><div class="mb-3 flex justify-between"><h3 class="text-xs font-semibold uppercase tracking-[.2em] text-gray-500">Pago</h3><b>Total: S/ <span x-text="total.toFixed(2)"></span></b></div><div class="grid gap-3 md:grid-cols-2"><div><label class="mb-2 block text-sm font-medium">Forma de pago</label><select name="forma_pago" x-model="formaPago" class="w-full rounded-xl border-gray-300"><option value="efectivo">Efectivo</option><option value="yape">Yape</option><option value="plin">Plin</option><option value="transferencia">Transferencia bancaria</option><option value="tarjeta">Tarjeta débito/crédito</option><option value="mixto">Mixto</option></select></div><div><label class="mb-2 block text-sm font-medium">Monto recibido</label><input name="monto_recibido" type="number" step=".01" x-model.number="recibido" :readonly="formaPago!=='efectivo'" class="w-full rounded-xl border-gray-300" :class="formaPago!=='efectivo'?'bg-gray-100':''"></div><div x-show="formaPago==='efectivo'"><label class="mb-2 block text-sm font-medium">Vuelto</label><input readonly :value="vuelto.toFixed(2)" class="w-full rounded-xl border-gray-300 bg-gray-100"></div></div></div>
    </div>
    <div class="rounded-xl border bg-gray-50 p-4"><h3 class="mb-3 text-xs font-semibold uppercase tracking-[.2em] text-gray-500">Comprobante</h3><div class="grid gap-3 md:grid-cols-2"><div><label class="mb-2 block text-sm font-medium">Tipo comprobante</label><select name="tipo_comprobante" x-model="tipoComprobante" class="w-full rounded-xl border-gray-300"><option value="boleta">Boleta</option><option value="factura">Factura</option></select></div><div><label class="mb-2 block text-sm font-medium">Documento cliente</label><input name="documento_cliente" x-model="documento" class="w-full rounded-xl border-gray-300" placeholder="DNI o RUC"></div></div><p class="mt-2 text-xs text-gray-500">La factura requiere RUC de 11 digitos y nombre/razon social del cliente.</p></div>
    <div><label class="mb-2 block text-sm font-medium">Observaciones</label><textarea name="observaciones" rows="3" class="w-full rounded-xl border-gray-300 bg-gray-50" placeholder="Notas adicionales sobre la venta"></textarea></div>
    <div class="flex gap-2"><button class="rounded-xl bg-[#111] px-4 py-2.5 text-sm font-medium text-white">Registrar venta</button><a href="/ventas" class="rounded-xl border px-4 py-2.5 text-sm">Cancelar</a></div>
  </form>
</div>
<script>function ventaForm(){return{productoElegido:'',lineas:[],formaPago:'efectivo',recibido:0,documento:'',cliente:'',tipoComprobante:'boleta',mensaje:'',agregar(){const s=document.querySelector('select[x-model="productoElegido"]'),o=s.options[s.selectedIndex];if(!o||!o.value)return;const id=Number(o.value);if(this.lineas.some(l=>l.id===id)){this.mensaje='El producto ya fue agregado';return}this.lineas.push({id,nombre:o.dataset.nombre,precio:Number(o.dataset.precio),stock:Number(o.dataset.stock),cantidad:1});this.productoElegido='';this.mensaje=''},consumidorFinal(){this.documento='99999999';this.cliente='Cliente mostrador';this.tipoComprobante='boleta'},get total(){return this.lineas.reduce((a,l)=>a+l.precio*Number(l.cantidad||0),0)},get vuelto(){return Math.max(0,Number(this.recibido||0)-this.total)}}}</script>
</div></body></html>
