<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head><title>Detalle de caja - ARTE Y METAL</title></head>
<body>
<div layout:fragment="content">

    <div class="space-y-5">
        <a th:href="@{/caja}" class="inline-flex items-center gap-1 text-sm text-gray-600 hover:text-gray-900">&larr; Volver</a>

        <div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">
            <div class="grid gap-4 md:grid-cols-3">
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Caja</p>
                    <p class="mt-1 text-gray-900" th:text="${apertura.caja?.nombre ?: apertura.nombre ?: ('Caja #' + apertura.id)}"></p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Usuario</p>
                    <p class="mt-1 text-gray-900" th:text="${apertura.usuario?.name ?: '-'}"></p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Apertura</p>
                    <p class="mt-1 text-gray-900" th:text="${#temporals.format(apertura.fechaApertura, 'dd/MM/yyyy HH:mm')}"></p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Cierre</p>
                    <p class="mt-1 text-gray-900" th:text="${apertura.fechaCierre != null ? #temporals.format(apertura.fechaCierre, 'dd/MM/yyyy HH:mm') : '—'}"></p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Monto inicial</p>
                    <p class="mt-1 text-gray-900" th:text="'S/ ' + ${#numbers.formatDecimal(apertura.montoInicial, 1, 2)}"></p>
                </div>
                <th:block th:with="finalEfectivo=${apertura.montoInicial.add(totalEfectivoVentas).subtract(totalVuelto)}">
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Final (efectivo)</p>
                    <p class="mt-1 text-gray-900 font-medium" th:text="'S/ ' + ${#numbers.formatDecimal(finalEfectivo, 1, 2)}"></p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">N° Ventas</p>
                    <p class="mt-1 text-gray-900" th:text="${cantidadVentas} + ' ventas'"></p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Total ventas</p>
                    <p class="mt-1 text-gray-900" th:text="'S/ ' + ${#numbers.formatDecimal(apertura.totalVentas, 1, 2)}"></p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Efectivo</p>
                    <p class="mt-1 text-emerald-700 font-medium" th:text="'S/ ' + ${#numbers.formatDecimal(totalEfectivoVentas, 1, 2)}"></p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Digital</p>
                    <p class="mt-1 text-sky-700 font-medium" th:text="'S/ ' + ${#numbers.formatDecimal(totalDigitalVentas, 1, 2)}"></p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Vuelto</p>
                    <p class="mt-1 text-red-600 font-medium" th:text="'-S/ ' + ${#numbers.formatDecimal(totalVuelto, 1, 2)}"></p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Total final</p>
                    <p class="mt-1 text-gray-900 font-semibold" th:text="'S/ ' + ${#numbers.formatDecimal(finalEfectivo.add(totalDigitalVentas), 1, 2)}"></p>
                </div>
                </th:block>
                <div class="md:col-span-3">
                    <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Estado</p>
                    <p class="mt-1">
                        <th:block th:if="${apertura.estado == 'abierta'}">
                            <span class="rounded-full bg-emerald-100 px-2.5 py-0.5 text-xs font-medium text-emerald-700">Abierta</span>
                        </th:block>
                        <th:block th:unless="${apertura.estado == 'abierta'}">
                            <span class="rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-600">Cerrada</span>
                        </th:block>
                    </p>
                </div>
                <th:block th:if="${apertura.observaciones != null and !apertura.observaciones.isEmpty()}">
                    <div class="md:col-span-3">
                        <p class="text-xs uppercase tracking-[0.2em] text-gray-500">Observaciones</p>
                        <p class="mt-1 text-gray-700" th:text="${apertura.observaciones}"></p>
                    </div>
                </th:block>
            </div>
        </div>

        <th:block th:if="${!ventas.isEmpty()}">
            <div class="rounded-2xl border border-gray-200 bg-white shadow-sm">
                <h3 class="border-b border-gray-200 px-5 py-3 text-sm font-semibold text-gray-800">Ventas registradas</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b border-gray-200 text-xs uppercase tracking-[0.15em] text-gray-500">
                                <th class="px-4 py-3 font-medium">Codigo</th>
                                <th class="px-4 py-3 font-medium">Cliente</th>
                                <th class="px-4 py-3 font-medium">Total</th>
                                <th class="px-4 py-3 font-medium">Hora</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="venta : ${ventas}" class="border-b border-gray-100 last:border-0 hover:bg-gray-50">
                                <td class="px-4 py-3 text-gray-900" th:text="${venta.codigo}"></td>
                                <td class="px-4 py-3 text-gray-700" th:text="${venta.clienteNombre != null ? venta.clienteNombre : 'Consumidor Final'}"></td>
                                <td class="px-4 py-3 text-gray-900" th:text="'S/ ' + ${#numbers.formatDecimal(venta.montoTotal, 1, 2)}"></td>
                                <td class="px-4 py-3 text-gray-500" th:text="${#temporals.format(venta.createdAt, 'HH:mm')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </th:block>
        <th:block th:if="${ventas.isEmpty()}">
            <div class="rounded-2xl border border-gray-200 bg-white p-8 text-center text-sm text-gray-500">No se registraron ventas en este turno.</div>
        </th:block>
    </div>

</div>
</body>
</html>
