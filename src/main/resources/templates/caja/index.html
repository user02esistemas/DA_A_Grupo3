<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Caja - ARTE Y METAL</title></head>
<body>
<div layout:fragment="content">
    <div x-data="{ modalAbrir:false, cerrarId:null, editarId:null, eliminarId:null, detalleId:null, filtrosAbiertos:false, filtrosCajaAbiertos:false, montoInicial:'', cajaSeleccionada:'' }" class="space-y-5">

        <!-- Cajas disponibles -->
        <section class="rounded-2xl border border-[#e5dec8] bg-white p-4 shadow-sm">
            <div class="flex items-center gap-2">
                <form id="search-cajas-form" method="get" th:action="@{/caja}" class="flex min-w-0 flex-1">
                    <input type="hidden" name="q" th:value="${busqueda}" />
                    <input type="hidden" name="estado" th:value="${filtroEstado}" />
                    <input type="hidden" name="cq_estado" th:value="${filtroCajaEstado}" />
                    <input type="text" name="cq" th:value="${busquedaCaja}" class="min-w-0 flex-1 rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-2.5 text-sm text-gray-900" placeholder="Buscar caja por nombre..." />
                </form>
                <button type="submit" form="search-cajas-form" class="btn-icon bg-blue-600 hover:bg-blue-700" title="Buscar">
                    <img th:src="@{/icons/buscar.ico}" alt="Buscar" class="h-5 w-5 object-contain pointer-events-none" />
                </button>
                <button type="button" @click="filtrosCajaAbiertos=!filtrosCajaAbiertos" class="btn-icon bg-sky-500 hover:bg-sky-600" :class="{ 'is-active': filtrosCajaAbiertos }" title="Filtrar">
                    <img th:src="@{/icons/filtros.ico}" alt="Filtrar" class="h-5 w-5 object-contain pointer-events-none" />
                </button>
                <a th:if="${!#strings.isEmpty(busquedaCaja) or !#strings.isEmpty(filtroCajaEstado)}" th:href="@{/caja(q=${busqueda},estado=${filtroEstado})}" class="shrink-0 rounded-xl border border-[#d1be8a] px-3 py-2.5 text-sm text-[#5a4314] hover:bg-[#fff5dd]">Limpiar</a>
                <button sec:authorize="hasAuthority('caja.gestionar')" type="button" @click="cajaSeleccionada=''; montoInicial=''; modalAbrir=true" class="btn-icon bg-[#09090f]" title="Abrir caja">
                    <img th:src="@{/icons/nuevo.ico}" alt="Nuevo" class="h-5 w-5 object-contain pointer-events-none" />
                </button>
            </div>
            <form x-show="filtrosCajaAbiertos" x-cloak x-transition method="get" th:action="@{/caja}" class="mt-4 flex flex-wrap items-end gap-4 border-t border-[#efe7d2] pt-4">
                <input type="hidden" name="q" th:value="${busqueda}" /><input type="hidden" name="cq" th:value="${busquedaCaja}" /><input type="hidden" name="estado" th:value="${filtroEstado}" />
                <div><label class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-gray-600">Estado</label>
                    <select name="cq_estado" class="rounded-xl border border-[#d1be8a] bg-white px-4 py-2.5 text-sm text-gray-700 shadow-sm">
                        <option value="">Todas</option><option value="abierta" th:selected="${filtroCajaEstado == 'abierta'}">Abierta</option><option value="cerrada" th:selected="${filtroCajaEstado == 'cerrada'}">Cerrada</option>
                    </select>
                </div>
                <button type="submit" class="rounded-xl bg-sky-500 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sky-600">Filtrar</button>
            </form>
        </section>

        <section class="overflow-hidden rounded-2xl border border-[#e5dec8] bg-white shadow-sm">
            <div class="overflow-x-auto"><table class="min-w-full text-sm">
                <thead class="bg-[#faf8f2] text-left text-[#5a4a2a]"><tr><th class="px-4 py-3 font-semibold">Caja</th><th class="px-4 py-3 font-semibold">Estado</th><th class="px-4 py-3 text-right font-semibold">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="caja : ${cajas}" class="border-b border-gray-100 last:border-0 hover:bg-gray-50">
                    <td class="px-4 py-3"><span class="rounded-lg bg-[#f4ebd4] px-2.5 py-1 text-xs font-semibold text-[#6a5122]" th:text="${caja.nombre}"></span></td>
                    <td class="px-4 py-3"><span th:if="${aperturaActiva[caja.id] != null}" class="rounded-full bg-emerald-100 px-2.5 py-0.5 text-xs font-medium text-emerald-700">Abierta</span><span th:unless="${aperturaActiva[caja.id] != null}" class="rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-600">Cerrada</span></td>
                    <td class="px-4 py-3"><div class="flex justify-end gap-2" sec:authorize="hasAuthority('caja.gestionar')">
                        <button th:if="${aperturaActiva[caja.id] == null}" type="button" th:attr="data-id=${caja.id},data-monto=${ultimoMontoFinal[caja.id]}" @click="cajaSeleccionada=$el.dataset.id; montoInicial=$el.dataset.monto||''; modalAbrir=true" class="btn-icon-sm bg-emerald-600 hover:bg-emerald-700" title="Abrir caja"><img th:src="@{/icons/nuevo.ico}" alt="Abrir" class="h-4 w-4 object-contain pointer-events-none" /></button>
                        <button th:if="${aperturaActiva[caja.id] != null}" type="button" th:attr="data-id=${aperturaActiva[caja.id].id}" @click="cerrarId=Number($el.dataset.id)" class="btn-icon-sm bg-rose-600 hover:bg-rose-700" title="Cerrar caja"><img th:src="@{/icons/cerrar.ico}" alt="Cerrar" class="h-4 w-4 object-contain pointer-events-none" /></button>
                        <button type="button" th:attr="data-id=${caja.id}" @click="editarId=Number($el.dataset.id)" class="btn-icon-sm bg-amber-400 hover:bg-amber-500" title="Editar caja"><img th:src="@{/icons/editar.ico}" alt="Editar" class="h-4 w-4 object-contain pointer-events-none" /></button>
                        <button th:if="${aperturaActiva[caja.id] == null}" type="button" th:attr="data-id=${caja.id}" @click="eliminarId=Number($el.dataset.id)" class="btn-icon-sm bg-red-600 hover:bg-red-700" title="Eliminar caja"><img th:src="@{/icons/eliminar.ico}" alt="Eliminar" class="h-4 w-4 object-contain pointer-events-none" /></button>
                    </div></td>
                </tr>
                <tr th:if="${#lists.isEmpty(cajas)}"><td colspan="3" class="px-4 py-8 text-center text-gray-500">No hay cajas registradas.</td></tr>
                </tbody>
            </table></div>
        </section>

        <!-- Historial -->
        <section class="overflow-hidden rounded-2xl border border-[#e5dec8] bg-white shadow-sm">
            <div class="border-b border-[#efe7d2] px-5 py-3"><h2 class="w-full text-center text-sm font-semibold uppercase text-[#5a4a2a]">Historial de Cajas</h2></div>
            <div class="px-4 py-3"><div class="flex items-center gap-2">
                <form id="search-historial-form" method="get" th:action="@{/caja}" class="flex min-w-0 flex-1"><input type="hidden" name="estado" th:value="${filtroEstado}" /><input type="text" name="q" th:value="${busqueda}" class="min-w-0 flex-1 rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-2.5 text-sm text-gray-900" placeholder="Buscar por caja o usuario" /></form>
                <button type="submit" form="search-historial-form" class="btn-icon bg-blue-600 hover:bg-blue-700" title="Buscar"><img th:src="@{/icons/buscar.ico}" alt="Buscar" class="h-5 w-5 object-contain pointer-events-none" /></button>
                <button type="button" @click="filtrosAbiertos=!filtrosAbiertos" class="btn-icon bg-sky-500 hover:bg-sky-600" :class="{ 'is-active': filtrosAbiertos }" title="Filtrar"><img th:src="@{/icons/filtros.ico}" alt="Filtrar" class="h-5 w-5 object-contain pointer-events-none" /></button>
                <a th:if="${!#strings.isEmpty(busqueda) or !#strings.isEmpty(filtroEstado)}" th:href="@{/caja}" class="shrink-0 rounded-xl border border-[#d1be8a] px-3 py-2.5 text-sm text-[#5a4314] hover:bg-[#fff5dd]">Limpiar</a>
            </div>
            <form x-show="filtrosAbiertos" x-cloak x-transition method="get" th:action="@{/caja}" class="mt-4 flex flex-wrap items-end gap-4 border-t border-[#efe7d2] pt-4"><input type="hidden" name="q" th:value="${busqueda}" /><div><label class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-gray-600">Estado</label><select name="estado" class="rounded-xl border border-[#d1be8a] bg-white px-4 py-2.5 text-sm text-gray-700"><option value="">Todos</option><option value="abierta" th:selected="${filtroEstado == 'abierta'}">Abierta</option><option value="cerrada" th:selected="${filtroEstado == 'cerrada'}">Cerrada</option></select></div><button type="submit" class="rounded-xl bg-sky-500 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sky-600">Filtrar</button></form>
            </div>
            <div class="overflow-x-auto"><table class="min-w-full text-sm">
                <thead class="bg-[#faf8f2] text-left text-[#5a4a2a]"><tr><th class="px-4 py-3">Caja</th><th class="px-4 py-3">Usuario</th><th class="px-4 py-3">Apertura</th><th class="px-4 py-3">Inicial</th><th class="px-4 py-3">Cierre</th><th class="px-4 py-3">Efectivo Final</th><th class="px-4 py-3">N° Ventas</th><th class="px-4 py-3">Efectivo</th><th class="px-4 py-3">Digital</th><th class="px-4 py-3">Vuelto</th><th class="px-4 py-3">Total final</th><th class="px-4 py-3">Estado</th><th class="px-4 py-3 text-right">Acciones</th></tr></thead>
                <tbody><tr th:each="ap : ${aperturas}" class="border-b border-gray-100 last:border-0 hover:bg-gray-50" th:with="r=${resumenAperturas[ap.id]}">
                    <td class="px-4 py-3"><span class="rounded-lg bg-[#f4ebd4] px-2.5 py-1 text-xs font-semibold text-[#6a5122]" th:text="${ap.caja != null ? ap.caja.nombre : ap.nombre}"></span></td><td class="px-4 py-3" th:text="${ap.usuario != null ? ap.usuario.name : '-'}"></td><td class="px-4 py-3" th:text="${#temporals.format(ap.fechaApertura,'dd/MM/yyyy HH:mm')}"></td><td class="px-4 py-3" th:text="|S/ ${#numbers.formatDecimal(ap.montoInicial,1,2)}|"></td><td class="px-4 py-3" th:text="${ap.fechaCierre != null ? #temporals.format(ap.fechaCierre,'dd/MM/yyyy HH:mm') : '-'}"></td>
                    <td class="px-4 py-3 font-semibold" th:text="|S/ ${#numbers.formatDecimal(r['efectivoFinal'],1,2)}|"></td><td class="px-4 py-3" th:text="${r['cantidadVentas']}"></td><td class="px-4 py-3 font-medium text-emerald-700" th:text="|S/ ${#numbers.formatDecimal(r['efectivo'],1,2)}|"></td><td class="px-4 py-3 font-medium text-sky-700" th:text="|S/ ${#numbers.formatDecimal(r['digital'],1,2)}|"></td><td class="px-4 py-3 font-medium text-red-600" th:text="|-S/ ${#numbers.formatDecimal(r['vuelto'],1,2)}|"></td><td class="px-4 py-3 font-semibold" th:text="|S/ ${#numbers.formatDecimal(r['totalFinal'],1,2)}|"></td><td class="px-4 py-3"><span th:if="${ap.estado == 'abierta'}" class="rounded-full bg-emerald-100 px-2.5 py-0.5 text-xs font-medium text-emerald-700">Abierta</span><span th:unless="${ap.estado == 'abierta'}" class="rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-600">Cerrada</span></td><td class="px-4 py-3 text-right"><button type="button" th:attr="data-id=${ap.id}" @click="detalleId=Number($el.dataset.id)" class="btn-icon-sm bg-[#0891B2]" title="Ver detalle"><img th:src="@{/icons/ver-detalle.ico}" alt="Ver" class="h-4 w-4 object-contain pointer-events-none" /></button></td>
                </tr><tr th:if="${aperturas.empty}"><td colspan="13" class="px-4 py-8 text-center text-gray-500">No hay registros en el historial.</td></tr></tbody>
            </table></div>
            <div class="border-t border-[#efe7d2] px-4 py-3" th:if="${aperturas.totalPages > 1}" th:replace="~{fragments/pagination :: pagination(${aperturas})}"></div>
        </section>

        <!-- Modal abrir -->
        <template x-teleport="body"><div x-show="modalAbrir" x-cloak><div class="fixed inset-0 z-40 bg-black/50" @click="modalAbrir=false"></div><div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white shadow-xl" @click.stop><div class="flex items-center justify-between border-b px-5 py-3"><h3 class="font-semibold">Abrir caja</h3><button type="button" @click="modalAbrir=false" class="btn-icon-sm bg-red-600" title="Cerrar"><img th:src="@{/icons/cerrar.ico}" class="h-4 w-4 pointer-events-none" /></button></div><form method="post" th:action="@{/caja/abrir}" class="space-y-4 p-5"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><div><label class="mb-2 block text-sm font-medium">Seleccionar caja</label><select name="caja_id" x-model="cajaSeleccionada" @change="montoInicial=$el.options[$el.selectedIndex]?.dataset.monto||''" required class="block w-full rounded-xl border border-gray-300 px-4 py-3"><option value="">Seleccione una caja</option><option th:each="c : ${cajas}" th:if="${aperturaActiva[c.id] == null}" th:value="${c.id}" th:attr="data-monto=${ultimoMontoFinal[c.id]}" th:text="${c.nombre}"></option></select></div><div><label class="mb-2 block text-sm font-medium">Monto inicial</label><input name="monto_inicial" type="number" step="0.01" min="0" required x-model="montoInicial" class="block w-full rounded-xl border border-gray-300 px-4 py-3" placeholder="0.00" /></div><div><label class="mb-2 block text-sm font-medium">Observaciones</label><textarea name="observaciones" rows="2" class="block w-full rounded-xl border border-gray-300 px-4 py-3" placeholder="Opcional"></textarea></div><button class="w-full rounded-xl bg-[#111] px-4 py-3 text-sm font-semibold text-white">Abrir caja</button></form></div></div></div></template>

        <!-- Modales por caja -->
        <th:block th:each="caja : ${cajas}">
            <template x-teleport="body"><div th:attr="data-id=${caja.id}" x-show="editarId === Number($el.dataset.id)" x-cloak><div class="fixed inset-0 z-40 bg-black/50" @click="editarId=null"></div><div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="w-full max-w-md rounded-2xl bg-white shadow-xl" @click.stop><div class="flex items-center justify-between border-b px-5 py-3"><h3 class="font-semibold">Editar caja</h3><button @click="editarId=null" class="btn-icon-sm bg-red-600"><img th:src="@{/icons/cerrar.ico}" class="h-4 w-4" /></button></div><form method="post" th:action="@{/caja/{id}/actualizar(id=${caja.id})}" class="space-y-4 p-5"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><div><label class="mb-2 block text-sm font-medium">Nombre</label><input name="nombre" th:value="${caja.nombre}" required class="block w-full rounded-xl border border-gray-300 px-4 py-3" /></div><label class="flex items-center gap-2 text-sm"><input type="checkbox" name="activa" value="true" th:checked="${caja.activa}" class="rounded text-emerald-600" /> Activa</label><button class="w-full rounded-xl bg-[#111] px-4 py-3 text-sm font-semibold text-white">Guardar cambios</button></form></div></div></div></template>
            <template x-teleport="body"><div th:attr="data-id=${caja.id}" x-show="eliminarId === Number($el.dataset.id)" x-cloak><div class="fixed inset-0 z-40 bg-black/50" @click="eliminarId=null"></div><div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="w-full max-w-md rounded-2xl bg-white p-5 text-center shadow-xl" @click.stop><img th:src="@{/icons/Alerta-Rojo.png}" class="mx-auto h-14 w-14" /><p class="my-4 text-sm">¿Estás seguro de eliminar esta caja?</p><div class="flex gap-3"><button @click="eliminarId=null" class="flex-1 rounded-xl border px-4 py-3">Cancelar</button><form method="post" th:action="@{/caja/{id}/eliminar(id=${caja.id})}" class="flex-1"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button class="w-full rounded-xl bg-red-600 px-4 py-3 text-white">Eliminar</button></form></div></div></div></div></template>
        </th:block>

        <!-- Cierre y detalle por apertura -->
        <th:block th:each="ap : ${aperturas}" th:with="r=${resumenAperturas[ap.id]}, esperado=${ap.montoInicial.add(r['efectivo']).add(r['digital']).subtract(r['vuelto'])}">
            <template th:if="${ap.estado == 'abierta'}" x-teleport="body"><div th:attr="data-id=${ap.id}" x-show="cerrarId === Number($el.dataset.id)" x-cloak><div class="fixed inset-0 z-40 bg-black/50" @click="cerrarId=null"></div><div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="w-full max-w-md rounded-2xl bg-white shadow-xl" @click.stop><div class="flex items-center justify-between border-b px-5 py-3"><h3 class="font-semibold">Cerrar caja</h3><button @click="cerrarId=null" class="btn-icon-sm bg-red-600"><img th:src="@{/icons/cerrar.ico}" class="h-4 w-4" /></button></div><form method="post" th:action="@{/caja/{id}/cerrar(id=${ap.id})}" class="space-y-4 p-5"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><p class="text-sm">Caja: <strong th:text="${ap.nombre}"></strong></p><div class="space-y-2 rounded-xl border bg-gray-50 p-4 text-sm"><div class="flex justify-between"><span>Monto inicial</span><span th:text="|S/ ${#numbers.formatDecimal(ap.montoInicial,1,2)}|"></span></div><div class="flex justify-between text-emerald-700"><span>+ Efectivo</span><span th:text="|S/ ${#numbers.formatDecimal(r['efectivo'],1,2)}|"></span></div><div class="flex justify-between text-sky-700"><span>+ Digital</span><span th:text="|S/ ${#numbers.formatDecimal(r['digital'],1,2)}|"></span></div><div class="flex justify-between text-red-600"><span>- Vuelto</span><span th:text="|-S/ ${#numbers.formatDecimal(r['vuelto'],1,2)}|"></span></div><hr/><div class="flex justify-between font-semibold"><span>Monto esperado</span><span th:text="|S/ ${#numbers.formatDecimal(esperado,1,2)}|"></span></div></div><div><label class="mb-2 block text-sm font-medium">Monto final en caja</label><input name="monto_final" type="number" step="0.01" min="0" required th:value="${esperado}" class="block w-full rounded-xl border px-4 py-3" /></div><textarea name="observaciones" rows="2" class="block w-full rounded-xl border px-4 py-3" placeholder="Observaciones (opcional)"></textarea><button class="w-full rounded-xl bg-rose-600 px-4 py-3 font-semibold text-white">Cerrar caja</button></form></div></div></div></template>
            <template x-teleport="body"><div th:attr="data-id=${ap.id}" x-show="detalleId === Number($el.dataset.id)" x-cloak><div class="fixed inset-0 z-40 bg-black/50" @click="detalleId=null"></div><div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="w-full max-w-lg rounded-2xl bg-white shadow-xl" @click.stop><div class="flex items-center justify-between border-b px-5 py-3"><h3 class="font-semibold">Detalle de apertura</h3><button @click="detalleId=null" class="btn-icon-sm bg-red-600"><img th:src="@{/icons/cerrar.ico}" class="h-4 w-4" /></button></div><div class="grid gap-4 p-5 md:grid-cols-2"><div><small class="uppercase text-gray-500">Caja</small><p th:text="${ap.nombre}"></p></div><div><small class="uppercase text-gray-500">Usuario</small><p th:text="${ap.usuario != null ? ap.usuario.name : '-'}"></p></div><div><small class="uppercase text-gray-500">Apertura</small><p th:text="${#temporals.format(ap.fechaApertura,'dd/MM/yyyy HH:mm')}"></p></div><div><small class="uppercase text-gray-500">Cierre</small><p th:text="${ap.fechaCierre != null ? #temporals.format(ap.fechaCierre,'dd/MM/yyyy HH:mm') : '-'}"></p></div><div><small class="uppercase text-gray-500">Monto inicial</small><p th:text="|S/ ${#numbers.formatDecimal(ap.montoInicial,1,2)}|"></p></div><div><small class="uppercase text-gray-500">Efectivo final</small><p class="font-semibold" th:text="|S/ ${#numbers.formatDecimal(r['efectivoFinal'],1,2)}|"></p></div><div><small class="uppercase text-gray-500">N° Ventas</small><p th:text="${r['cantidadVentas']}"></p></div><div><small class="uppercase text-gray-500">Total final</small><p class="font-semibold" th:text="|S/ ${#numbers.formatDecimal(r['totalFinal'],1,2)}|"></p></div><div class="md:col-span-2" th:if="${ap.observaciones != null}"><small class="uppercase text-gray-500">Observaciones</small><p th:text="${ap.observaciones}"></p></div></div></div></div></div></template>
        </th:block>
    </div>
</div>
</body>
</html>
