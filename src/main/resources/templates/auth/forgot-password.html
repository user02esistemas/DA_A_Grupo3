<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/guest}">
<head><title>Recuperar Contrasena - ARTE Y METAL</title></head>
<body>
<div layout:fragment="content">
    <div class="mb-7">
        <div class="mb-5 flex items-center gap-4 rounded-xl border border-[#d7c08a] bg-[#fff9ec] px-4 py-3">
            <img th:src="@{/images/ARTE-Y-METAL.png}" alt="Logo Arte y Metal" class="h-14 w-14 rounded-lg border border-[#d4af55]/50 object-cover p-1" />
            <div>
                <p class="text-xs uppercase tracking-[0.28em] text-[#9e7321]">Sistema de Gestion</p>
                <h1 class="text-xl text-[#241c0f]" style="font-family:'Cinzel',serif;">ARTE Y METAL</h1>
            </div>
        </div>
        <p class="text-xs uppercase tracking-[0.28em] text-[#9e7321]">Recuperar Acceso</p>
        <h2 class="mt-2 text-3xl text-[#241c0f]" style="font-family:'Cinzel',serif;">Olvidaste tu contrasena?</h2>
        <p class="mt-2 text-sm text-[#5a4a2a]">Ingresa tu correo y te enviaremos un codigo de 6 digitos para que puedas restablecerla.</p>
    </div>

    <div th:if="${param.exito}" class="mb-5 rounded-xl border border-emerald-300 bg-emerald-50 px-4 py-3 text-sm text-emerald-600">
        <span th:text="${param.exito[0]}"></span>
    </div>

    <form method="POST" th:action="@{/forgot-password}" class="space-y-5">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div>
            <label for="email" class="mb-2 block text-sm font-medium text-[#4d4026]">Correo electronico</label>
            <input id="email" type="email" name="email" th:value="${old_email}" required autofocus
                class="block w-full rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-3 text-[#251e12] placeholder-[#9f8c62] focus:border-[#cba34d] focus:ring-[#cba34d]"
                placeholder="tu@correo.com" />
            <p th:if="${error_email}" class="mt-2 text-sm text-rose-600" th:text="${error_email}"></p>
        </div>

        <button type="submit"
            class="w-full rounded-xl bg-gradient-to-r from-[#7a5b25] via-[#c79d41] to-[#f0dca7] px-4 py-3 text-sm font-semibold uppercase tracking-[0.2em] text-[#191506] transition hover:brightness-110">
            Enviar codigo de recuperacion
        </button>
    </form>

    <div class="mt-4 text-center text-sm text-[#5a4a2a]">
        <a th:href="@{/login}" class="font-medium text-[#9e7321] hover:text-[#7f5d1a]">Volver al inicio de sesion</a>
    </div>
</div>
</body>
</html>
