<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/guest}">
<head><title>Verificar Email - ARTE Y METAL</title></head>
<body>
<div layout:fragment="content">
    <div class="mb-7">
        <div class="mb-5 flex items-center gap-4 rounded-xl border border-[#d7c08a] bg-[#fff9ec] px-4 py-3">
            <img th:src="@{/images/ARTE-Y-METAL.png}" alt="Logo Arte y Metal" class="h-14 w-14 rounded-lg border border-[#d4af55]/50 object-cover p-1" />
            <div>
                <p class="text-xs uppercase tracking-[0.28em] text-[#9e7321]">Sistema de Gestion</p>
                <h1 class="text-xl text-[#241c0f]" style="font-family:'Cinzel',serif;">ARTE Y METAL</h1>
            </div>
        </div>
        <p class="text-sm text-[#5a4a2a]">Gracias por registrarte! Antes de comenzar, podrias verificar tu direccion de correo electronico haciendo clic en el enlace que te enviamos?</p>
        <p class="mt-2 text-sm text-[#5a4a2a]">Si no recibiste el correo, podemos enviarte otro.</p>
    </div>

    <div th:if="${param.exito}" class="mb-5 rounded-xl border border-emerald-300 bg-emerald-50 px-4 py-3 text-sm text-emerald-600">
        <span th:text="${param.exito[0]}"></span>
    </div>

    <div class="space-y-4">
        <form method="POST" th:action="@{/verify-email}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit"
                class="w-full rounded-xl bg-gradient-to-r from-[#7a5b25] via-[#c79d41] to-[#f0dca7] px-4 py-3 text-sm font-semibold uppercase tracking-[0.2em] text-[#191506] transition hover:brightness-110">
                Reenviar correo de verificacion
            </button>
        </form>

        <form method="POST" th:action="@{/logout}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit"
                class="w-full rounded-xl border border-[#d1be8a] bg-white px-4 py-3 text-sm font-medium text-[#5a4a2a] transition hover:bg-[#fff9ec]">
                Cerrar sesion
            </button>
        </form>
    </div>
</div>
</body>
</html>
