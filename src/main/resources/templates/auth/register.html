<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/guest}">
<head><title>Registro - ARTE Y METAL</title></head>
<body>
<div layout:fragment="content">
    <div class="mb-7">
        <div class="mb-5 flex items-center gap-4 rounded-xl border border-[#d7c08a] bg-[#fff9ec] px-4 py-3">
            <img th:src="@{/images/ARTE-Y-METAL.png}" alt="Logo Arte y Metal" class="h-14 w-14 rounded-lg border border-[#d4af55]/50 object-cover p-1" />
            <div>
                <p class="text-xs uppercase tracking-[0.28em] text-[#9e7321]">Sistema de Gestion</p>
                <h1 class="text-xl text-[#241c0f]" style="font-family:'Cinzel',serif;">ARTE Y METAL</h1>
            </div>
        </div>
        <p class="text-xs uppercase tracking-[0.28em] text-[#9e7321]">Crear Cuenta</p>
        <h2 class="mt-2 text-3xl text-[#241c0f]" style="font-family:'Cinzel',serif;">Registrarse</h2>
        <p class="mt-2 text-sm text-[#5a4a2a]">Crea tu cuenta para acceder al sistema.</p>
    </div>

    <form method="POST" th:action="@{/register}" class="space-y-5">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div>
            <label for="name" class="mb-2 block text-sm font-medium text-[#4d4026]">Nombre</label>
            <input id="name" type="text" name="name" th:value="${old_name}" required autofocus autocomplete="name"
                class="block w-full rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-3 text-[#251e12] placeholder-[#9f8c62] focus:border-[#cba34d] focus:ring-[#cba34d]"
                placeholder="Tu nombre completo" />
            <p th:if="${error_name}" class="mt-2 text-sm text-rose-600" th:text="${error_name}"></p>
        </div>

        <div>
            <label for="email" class="mb-2 block text-sm font-medium text-[#4d4026]">Correo electronico</label>
            <input id="email" type="email" name="email" th:value="${old_email}" required autocomplete="username"
                class="block w-full rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-3 text-[#251e12] placeholder-[#9f8c62] focus:border-[#cba34d] focus:ring-[#cba34d]"
                placeholder="tu@correo.com" />
            <p th:if="${error_email}" class="mt-2 text-sm text-rose-600" th:text="${error_email}"></p>
        </div>

        <div>
            <label for="password" class="mb-2 block text-sm font-medium text-[#4d4026]">Contrasena</label>
            <input id="password" type="password" name="password" required autocomplete="new-password"
                class="block w-full rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-3 text-[#251e12] placeholder-[#9f8c62] focus:border-[#cba34d] focus:ring-[#cba34d]"
                placeholder="******" />
            <p th:if="${error_password}" class="mt-2 text-sm text-rose-600" th:text="${error_password}"></p>
        </div>

        <div>
            <label for="password_confirmation" class="mb-2 block text-sm font-medium text-[#4d4026]">Confirmar contrasena</label>
            <input id="password_confirmation" type="password" name="password_confirmation" required autocomplete="new-password"
                class="block w-full rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-3 text-[#251e12] placeholder-[#9f8c62] focus:border-[#cba34d] focus:ring-[#cba34d]"
                placeholder="******" />
        </div>

        <div class="flex items-center justify-end gap-4">
            <a th:href="@{/login}" class="text-sm text-[#9e7321] hover:text-[#7f5d1a]">Ya tienes cuenta? Inicia sesion</a>
            <button type="submit"
                class="rounded-xl bg-gradient-to-r from-[#7a5b25] via-[#c79d41] to-[#f0dca7] px-6 py-3 text-sm font-semibold uppercase tracking-[0.2em] text-[#191506] transition hover:brightness-110">
                Registrarse
            </button>
        </div>
    </form>
</div>
</body>
</html>
