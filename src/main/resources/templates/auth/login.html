<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/guest}">
    <head>
        <title>Login - ARTE Y METAL</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="mb-7">
                <div class="mb-5 flex items-center gap-4 rounded-xl border border-[#d7c08a] bg-[#fff9ec] px-4 py-3">
                    <img th:src="@{/images/ARTE-Y-METAL.png}" alt="Logo Arte y Metal" class="h-14 w-14 rounded-lg border border-[#d4af55]/50 object-cover p-1" />
                    <div>
                        <p class="text-xs uppercase tracking-[0.28em] text-[#9e7321]">Sistema de Gestion</p>
                        <h1 class="text-xl text-[#241c0f]" style="font-family:'Cinzel',serif;">ARTE Y METAL</h1>
                    </div>
                </div>
                <p class="text-xs uppercase tracking-[0.28em] text-[#9e7321]">Acceso Seguro</p>
                <h2 class="mt-2 text-3xl text-[#241c0f]" style="font-family:'Cinzel',serif;">Iniciar Sesion</h2>
                <p class="mt-2 text-sm text-[#5a4a2a]">Ingresa para gestionar produccion, clientes y pedidos personalizados.</p>
            </div>

            <div th:if="${param.error}" class="mb-5 rounded-xl border border-rose-300 bg-rose-50 px-4 py-3 text-sm text-rose-600">
                Correo electronico o contrasena incorrectos.
            </div>
            <div th:if="${param.logout}" class="mb-5 rounded-xl border border-emerald-300 bg-emerald-50 px-4 py-3 text-sm text-emerald-600">
                Sesion cerrada correctamente.
            </div>
            <div th:if="${param.exito}" class="mb-5 rounded-xl border border-emerald-300 bg-emerald-50 px-4 py-3 text-sm text-emerald-600">
                <span th:text="${param.exito[0]}"></span>
            </div>

            <form id="form-login" th:action="@{/login}" method="post" class="space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div>
                    <label for="login" class="mb-2 block text-sm font-medium text-[#4d4026]">Correo electronico o usuario</label>
                    <input id="login" type="text" name="login" required autofocus autocomplete="username"
                        class="block w-full rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-3 text-[#251e12] placeholder-[#9f8c62] focus:border-[#cba34d] focus:ring-[#cba34d]"
                        placeholder="usuario@correo.com o usuario" />
                </div>

                <div x-data="{ mostrarContrasena: false }">
                    <label for="password" class="mb-2 block text-sm font-medium text-[#4d4026]">Contrasena</label>
                    <div class="relative">
                        <input id="password" :type="mostrarContrasena ? 'text' : 'password'" name="password" required
                            onkeydown="if(event.key === 'Enter'){ event.preventDefault(); document.getElementById('form-login').requestSubmit(); }"
                            class="block w-full rounded-xl border border-[#d1be8a] bg-[#fffdf7] px-4 py-3 pr-14 text-[#251e12] placeholder-[#9f8c62] focus:border-[#cba34d] focus:ring-[#cba34d]"
                            placeholder="******" />
                        <button type="button" @click="mostrarContrasena = !mostrarContrasena"
                            class="absolute right-3 top-1/2 inline-flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-md text-[#8a6a2e] hover:bg-[#f5ecd6] hover:text-[#5a4314]"
                            :title="mostrarContrasena ? 'Ocultar contrasena' : 'Ver contrasena'">
                            <svg x-show="!mostrarContrasena" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z" />
                                <circle cx="12" cy="12" r="3" stroke-width="1.9"></circle>
                            </svg>
                            <svg x-show="mostrarContrasena" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: none;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M3 3l18 18" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M10.58 10.58a2 2 0 102.84 2.84" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M9.88 5.09A11.7 11.7 0 0112 5c6.5 0 10 7 10 7a16.9 16.9 0 01-4.21 4.62M6.6 6.6C4.08 8.13 2.5 10.5 2 12c0 0 3.5 7 10 7 1.87 0 3.5-.45 4.92-1.14" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between gap-4">
                    <label for="remember" class="inline-flex items-center text-sm text-[#5a4a2a]">
                        <input id="remember" type="checkbox" name="remember" class="rounded border-[#ccb784] bg-white text-[#b8882f] focus:ring-[#b8882f]" />
                        <span class="ms-2">Recordarme</span>
                    </label>

                    <a href="#" class="text-sm text-[#9e7321] hover:text-[#7f5d1a]">Olvidaste tu contrasena?</a>
                </div>

                <button type="submit"
                    class="w-full rounded-xl bg-gradient-to-r from-[#7a5b25] via-[#c79d41] to-[#f0dca7] px-4 py-3 text-sm font-semibold uppercase tracking-[0.2em] text-[#191506] transition hover:brightness-110">
                    Entrar al sistema
                </button>
            </form>
        </div>
    </body>
</html>
