# ========================================
# ARTE Y METAL - Configuracion Spring Boot
# ========================================

# Servidor
server.port=8081

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/arteymetal
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Hidden HTTP method filter (PUT/DELETE via _method param)
spring.mvc.hiddenmethod.filter.enabled=true

# Multipart (subida de archivos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Archivos subidos
app.upload.dir=uploads/

# Decolecta API (RENIEC/DNI + SUNAT/RUC)
decolecta.base-url=https://api.decolecta.com
decolecta.api-key=
decolecta.reniec-dni-path=/v1/reniec/dni
decolecta.sunat-ruc-path=/v1/sunat/ruc

# Logging
logging.level.com.arteymetal=DEBUG

# Mail (para recuperacion de contrasena)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

# Password reset code expiry (minutes)
app.password-reset.code-expiry-minutes=15
